<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Collaborative SVG Masterpiece</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020010;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    .canvas {
      position: relative;
      width: 800px;
      height: 600px;
    }
    .layer {
      position: absolute;
      inset: 0;
      width: 800px;
      height: 600px;
    }
    /* Bottom layer: cosmic gradients — the atmosphere */
    .layer-gradients {
      z-index: 1;
      opacity: 1;
    }
    /* Middle layer: organic forms — the life */
    .layer-organic {
      z-index: 2;
      mix-blend-mode: screen;
      opacity: 0.75;
    }
    /* Top layer: sacred geometry — the structure */
    .layer-geometric {
      z-index: 3;
      mix-blend-mode: screen;
      opacity: 0.65;
    }
    /* Title overlay */
    .title {
      position: absolute;
      z-index: 10;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
    }
    /* Vignette overlay for cohesion */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(2, 0, 16, 0.6) 100%);
    }
  </style>
</head>
