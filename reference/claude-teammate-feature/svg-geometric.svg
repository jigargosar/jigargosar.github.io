<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Deep jewel tone palette: deep blue, emerald, gold, ruby -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>

    <!-- Hexagonal pattern tile -->
    <pattern id="hexGrid" x="0" y="0" width="60" height="104" patternUnits="userSpaceOnUse">
      <!-- Two rows of hexagons offset -->
      <polygon points="30,2 58,17 58,47 30,62 2,47 2,17"
               fill="none" stroke="#1a3a8f" stroke-width="0.8" opacity="0.5"/>
      <polygon points="30,54 58,69 58,99 30,114 2,99 2,69"
               fill="none" stroke="#1a3a8f" stroke-width="0.8" opacity="0.5"/>
      <polygon points="60,28 88,43 88,73 60,88 32,73 32,43"
               fill="none" stroke="#1a3a8f" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Star of David / sacred geometry filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clipping path -->
    <clipPath id="mainClip">
      <rect x="0" y="0" width="800" height="600"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Hex grid overlay -->
  <rect width="800" height="600" fill="url(#hexGrid)" opacity="0.4"/>

  <!-- ====== OUTER SACRED CIRCLE RINGS ====== -->
  <g transform="translate(400,300)" clip-path="url(#mainClip)">

    <!-- Outermost decorative ring -->
    <circle r="280" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.3"/>
    <circle r="275" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.2"/>

    <!-- Flower of Life outer ring circles (6-fold symmetry) -->
    <g opacity="0.25">
      <circle cx="0" cy="-240" r="120" fill="none" stroke="#4169e1" stroke-width="1"/>
      <circle cx="207.8" cy="-120" r="120" fill="none" stroke="#4169e1" stroke-width="1"/>
      <circle cx="207.8" cy="120" r="120" fill="none" stroke="#4169e1" stroke-width="1"/>
      <circle cx="0" cy="240" r="120" fill="none" stroke="#4169e1" stroke-width="1"/>
      <circle cx="-207.8" cy="120" r="120" fill="none" stroke="#4169e1" stroke-width="1"/>
      <circle cx="-207.8" cy="-120" r="120" fill="none" stroke="#4169e1" stroke-width="1"/>
    </g>

    <!-- ====== OUTER STAR POLYGON (12-pointed) ====== -->
    <polygon points="0,-250 29.4,-229.9 58.0,-240.1 58.0,-209.0 84.4,-194.1 70.5,-165.5 100,-153.2 83.0,-126.7 111.8,-111.8 92.8,-86.7 120,-69.1 99.2,-45.4 125,0 99.2,45.4 120,69.1 92.8,86.7 111.8,111.8 83.0,126.7 100,153.2 70.5,165.5 84.4,194.1 58.0,209.0 58.0,240.1 29.4,229.9 0,250 -29.4,229.9 -58.0,240.1 -58.0,209.0 -84.4,194.1 -70.5,165.5 -100,153.2 -83.0,126.7 -111.8,111.8 -92.8,86.7 -120,69.1 -99.2,45.4 -125,0 -99.2,-45.4 -120,-69.1 -92.8,-86.7 -111.8,-111.8 -83.0,-126.7 -100,-153.2 -70.5,-165.5 -84.4,-194.1 -58.0,-209.0 -58.0,-240.1 -29.4,-229.9"
          fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.5"/>

    <!-- ====== OUTER TESSELLATION RING: 12 triangles ====== -->
    <g opacity="0.7">
      <!-- Ruby triangles pointing outward -->
      <polygon points="0,-220 30,-160 -30,-160" fill="#8b0000" stroke="#dc143c" stroke-width="1.5"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#8b0000" stroke="#dc143c" stroke-width="1.5" transform="rotate(30)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#6b0e6b" stroke="#9b00b5" stroke-width="1.5" transform="rotate(60)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#00400a" stroke="#00a020" stroke-width="1.5" transform="rotate(90)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#00400a" stroke="#00a020" stroke-width="1.5" transform="rotate(120)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#6b0e6b" stroke="#9b00b5" stroke-width="1.5" transform="rotate(150)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#8b0000" stroke="#dc143c" stroke-width="1.5" transform="rotate(180)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#8b0000" stroke="#dc143c" stroke-width="1.5" transform="rotate(210)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#6b0e6b" stroke="#9b00b5" stroke-width="1.5" transform="rotate(240)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#00400a" stroke="#00a020" stroke-width="1.5" transform="rotate(270)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#00400a" stroke="#00a020" stroke-width="1.5" transform="rotate(300)"/>
      <polygon points="0,-220 30,-160 -30,-160" fill="#6b0e6b" stroke="#9b00b5" stroke-width="1.5" transform="rotate(330)"/>
    </g>

    <!-- ====== METATRON'S CUBE LINES ====== -->
    <g opacity="0.4" stroke="#ffd700" stroke-width="0.7" fill="none">
      <!-- Lines connecting the 6 inner Flower of Life centers -->
      <line x1="0" y1="-120" x2="103.9" y2="-60"/>
      <line x1="103.9" y1="-60" x2="103.9" y2="60"/>
      <line x1="103.9" y1="60" x2="0" y2="120"/>
      <line x1="0" y1="120" x2="-103.9" y2="60"/>
      <line x1="-103.9" y1="60" x2="-103.9" y2="-60"/>
      <line x1="-103.9" y1="-60" x2="0" y2="-120"/>
      <!-- Long diagonals -->
      <line x1="0" y1="-120" x2="103.9" y2="60"/>
      <line x1="0" y1="-120" x2="-103.9" y2="60"/>
      <line x1="103.9" y1="-60" x2="-103.9" y2="-60"/>
      <line x1="103.9" y1="-60" x2="0" y2="120"/>
      <line x1="103.9" y1="-60" x2="-103.9" y2="60"/>
      <line x1="103.9" y1="60" x2="-103.9" y2="-60"/>
      <line x1="103.9" y1="60" x2="0" y2="-120"/>
      <line x1="103.9" y1="60" x2="-103.9" y2="60"/>
      <line x1="0" y1="120" x2="103.9" y2="-60"/>
      <line x1="0" y1="120" x2="-103.9" y2="-60"/>
      <line x1="-103.9" y1="-60" x2="-103.9" y2="60"/>
      <line x1="-103.9" y1="60" x2="103.9" y2="-60"/>
    </g>

    <!-- ====== STAR OF DAVID (two interlocking triangles) ====== -->
    <!-- Upward triangle -->
    <polygon points="0,-155 134.3,77.5 -134.3,77.5"
             fill="rgba(30,60,180,0.2)" stroke="#4169e1" stroke-width="2.5"
             filter="url(#glow)"/>
    <!-- Downward triangle -->
    <polygon points="0,155 134.3,-77.5 -134.3,-77.5"
             fill="rgba(0,150,50,0.15)" stroke="#00a030" stroke-width="2.5"
             filter="url(#glow)"/>

    <!-- ====== INNER HEXAGON ====== -->
    <polygon points="0,-90 77.9,-45 77.9,45 0,90 -77.9,45 -77.9,-45"
             fill="rgba(0,10,40,0.6)" stroke="#ffd700" stroke-width="2"
             filter="url(#innerGlow)"/>

    <!-- ====== INNER RING: 6 smaller triangles ====== -->
    <g opacity="0.85">
      <polygon points="0,-85 42,-42.5 -42,-42.5" fill="#1a0050" stroke="#7b2dff" stroke-width="1.5"/>
      <polygon points="0,-85 42,-42.5 -42,-42.5" fill="#001a30" stroke="#00a8ff" stroke-width="1.5" transform="rotate(60)"/>
      <polygon points="0,-85 42,-42.5 -42,-42.5" fill="#002500" stroke="#00d050" stroke-width="1.5" transform="rotate(120)"/>
      <polygon points="0,-85 42,-42.5 -42,-42.5" fill="#1a0050" stroke="#7b2dff" stroke-width="1.5" transform="rotate(180)"/>
      <polygon points="0,-85 42,-42.5 -42,-42.5" fill="#001a30" stroke="#00a8ff" stroke-width="1.5" transform="rotate(240)"/>
      <polygon points="0,-85 42,-42.5 -42,-42.5" fill="#002500" stroke="#00d050" stroke-width="1.5" transform="rotate(300)"/>
    </g>

    <!-- ====== FLOWER OF LIFE INNER CIRCLES ====== -->
    <g fill="none" opacity="0.6">
      <circle r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
      <circle cx="0" cy="-60" r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
      <circle cx="51.96" cy="-30" r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
      <circle cx="51.96" cy="30" r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
      <circle cx="0" cy="60" r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
      <circle cx="-51.96" cy="30" r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
      <circle cx="-51.96" cy="-30" r="60" stroke="#ffd700" stroke-width="1.2" fill="rgba(184,134,11,0.05)"/>
    </g>

    <!-- ====== CENTER MANDALA ====== -->
    <!-- Center circle -->
    <circle r="36" fill="rgba(139,0,0,0.4)" stroke="#dc143c" stroke-width="2" filter="url(#glow)"/>
    <!-- Center star (8-pointed) -->
    <polygon points="0,-32 7.6,-7.6 32,0 7.6,7.6 0,32 -7.6,7.6 -32,0 -7.6,-7.6"
             fill="#8b0000" stroke="#ff4444" stroke-width="1.5" filter="url(#glow)"/>
    <polygon points="0,-32 7.6,-7.6 32,0 7.6,7.6 0,32 -7.6,7.6 -32,0 -7.6,-7.6"
             fill="rgba(255,68,68,0.2)" stroke="#ff8888" stroke-width="1"
             transform="rotate(22.5)" filter="url(#glow)"/>
    <!-- Tiny center dot -->
    <circle r="6" fill="#ffd700" filter="url(#glow)"/>
    <circle r="3" fill="#fff8dc"/>

    <!-- ====== OUTER DECORATIVE RINGS ====== -->
    <circle r="160" fill="none" stroke="#4169e1" stroke-width="1" opacity="0.4"/>
    <circle r="165" fill="none" stroke="#00a030" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,8"/>

    <!-- ====== CARDINAL AXIS LINES ====== -->
    <g stroke="#b8860b" stroke-width="0.8" opacity="0.35" fill="none">
      <line x1="0" y1="-280" x2="0" y2="280"/>
      <line x1="-280" y1="0" x2="280" y2="0"/>
      <line x1="-198" y1="-198" x2="198" y2="198"/>
      <line x1="198" y1="-198" x2="-198" y2="198"/>
    </g>

    <!-- ====== OUTER CORNER TRIANGLE ACCENTS ====== -->
    <!-- These extend beyond the circle toward corners -->
    <g opacity="0.5">
      <polygon points="0,-270 22,-230 -22,-230" fill="#b8860b" stroke="#ffd700" stroke-width="1"/>
      <polygon points="270,0 230,22 230,-22" fill="#b8860b" stroke="#ffd700" stroke-width="1"/>
      <polygon points="0,270 22,230 -22,230" fill="#b8860b" stroke="#ffd700" stroke-width="1"/>
      <polygon points="-270,0 -230,22 -230,-22" fill="#b8860b" stroke="#ffd700" stroke-width="1"/>
    </g>

  </g>

  <!-- ====== CORNER FRACTAL HEXAGONS ====== -->
  <!-- Top-left -->
  <g transform="translate(70,60)" opacity="0.55">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
             fill="rgba(0,80,0,0.3)" stroke="#00a030" stroke-width="1.5"/>
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"
             fill="rgba(0,150,50,0.3)" stroke="#00c040" stroke-width="1"/>
    <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5"
             fill="#00a030" stroke="#50ff90" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Top-right -->
  <g transform="translate(730,60)" opacity="0.55">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
             fill="rgba(80,0,0,0.3)" stroke="#dc143c" stroke-width="1.5"/>
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"
             fill="rgba(150,0,50,0.3)" stroke="#ff2060" stroke-width="1"/>
    <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5"
             fill="#dc143c" stroke="#ff8888" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Bottom-left -->
  <g transform="translate(70,540)" opacity="0.55">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
             fill="rgba(0,0,100,0.3)" stroke="#4169e1" stroke-width="1.5"/>
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"
             fill="rgba(30,60,180,0.3)" stroke="#6090ff" stroke-width="1"/>
    <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5"
             fill="#4169e1" stroke="#aac0ff" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Bottom-right -->
  <g transform="translate(730,540)" opacity="0.55">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
             fill="rgba(80,60,0,0.3)" stroke="#b8860b" stroke-width="1.5"/>
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"
             fill="rgba(140,100,0,0.3)" stroke="#e0a820" stroke-width="1"/>
    <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5"
             fill="#b8860b" stroke="#ffe060" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- ====== BORDER FRAME ====== -->
  <rect x="8" y="8" width="784" height="584" fill="none"
        stroke="#b8860b" stroke-width="1.5" opacity="0.6"/>
  <rect x="14" y="14" width="772" height="572" fill="none"
        stroke="#4169e1" stroke-width="0.5" opacity="0.4"/>

</svg>
