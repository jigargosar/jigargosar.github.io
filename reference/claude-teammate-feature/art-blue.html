<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Team — Unified Artwork</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a12;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .stage {
      position: relative;
      width: 400px;
      height: 400px;
    }

    /* Layer 1 — artist-3: fractal triangles, base structure */
    /* Scaled up 1.8x, centered, slow rotation, screen blend */
    .layer-triangles {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      mix-blend-mode: screen;
      opacity: 0.85;
      animation: spin-slow 40s linear infinite;
      transform-origin: center center;
    }

    .layer-triangles svg {
      width: 360px;
      height: 360px;
    }

    /* Layer 2 — artist-2: starburst, energetic mid-layer */
    /* Scaled 1.4x, counter-rotation, overlay blend */
    .layer-starburst {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      mix-blend-mode: hard-light;
      opacity: 0.78;
      animation: spin-reverse 18s linear infinite;
      transform-origin: center center;
    }

    .layer-starburst svg {
      width: 280px;
      height: 280px;
    }

    /* Layer 3 — artist-1: teal arcs, foreground accent */
    /* Scaled 1.6x, slight rotation offset, color-dodge blend */
    .layer-arcs {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      mix-blend-mode: color-dodge;
      opacity: 0.92;
      animation: spin-arcs 25s linear infinite;
      transform-origin: center center;
    }

    .layer-arcs svg {
      width: 320px;
      height: 320px;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    @keyframes spin-arcs {
      from { transform: rotate(-15deg); }
      to   { transform: rotate(345deg); }
    }
  </style>
</head>
<body>
  <div class="stage">

    <!-- Layer 1: Sierpinski fractal triangles — amber/gold skeleton -->
    <div class="layer-triangles">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
        <defs>
          <style>.tri { fill: none; stroke-linejoin: round; }</style>
        </defs>
        <polygon class="tri" points="100,10 190,165 10,165"
          stroke="#F59E0B" stroke-width="3" fill="none"/>
        <polygon class="tri" points="100,165 55,85 145,85"
          stroke="#D97706" stroke-width="2.5" fill="rgba(245,158,11,0.08)"/>
        <polygon class="tri" points="55,85 100,10 77.5,47.5"
          stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.1)"/>
        <polygon class="tri" points="100,10 145,85 122.5,47.5"
          stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.1)"/>
        <polygon class="tri" points="55,85 145,85 100,165"
          stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.1)"/>
        <polygon class="tri" points="100,85 115,112 85,112"
          stroke="#92400E" stroke-width="1.5" fill="rgba(146,64,14,0.2)"/>
        <circle cx="100" cy="10" r="4" fill="#F59E0B" opacity="0.9"/>
        <circle cx="190" cy="165" r="4" fill="#F59E0B" opacity="0.9"/>
        <circle cx="10" cy="165" r="4" fill="#F59E0B" opacity="0.9"/>
      </svg>
    </div>

    <!-- Layer 2: Starburst — amber/coral energy bloom -->
    <div class="layer-starburst">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
        <defs>
          <style>.petal { fill-opacity: 0.75; }</style>
        </defs>
        <g transform="translate(100,100)">
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FF6B35" transform="rotate(0)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#F7931E" transform="rotate(30)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FFD166" transform="rotate(60)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FF6B35" transform="rotate(90)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#F7931E" transform="rotate(120)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FFD166" transform="rotate(150)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FF6B35" transform="rotate(180)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#F7931E" transform="rotate(210)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FFD166" transform="rotate(240)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FF6B35" transform="rotate(270)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#F7931E" transform="rotate(300)"/>
          <ellipse class="petal" cx="0" cy="-45" rx="12" ry="40" fill="#FFD166" transform="rotate(330)"/>
          <circle r="10" fill="#FF4500" fill-opacity="0.9"/>
          <circle r="5" fill="#FFFFFF" fill-opacity="0.6"/>
        </g>
      </svg>
    </div>

    <!-- Layer 3: Concentric teal arcs — cool foreground spiral -->
    <div class="layer-arcs">
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <g fill="none" stroke-linecap="round">
          <path d="M 100 170 A 70 70 0 0 1 30 100" stroke="#00BCD4" stroke-width="6" opacity="0.9"/>
          <path d="M 100 155 A 55 55 0 0 1 45 100" stroke="#26C6DA" stroke-width="5" opacity="0.8"/>
          <path d="M 100 140 A 40 40 0 0 1 60 100" stroke="#4DD0E1" stroke-width="4" opacity="0.7"/>
          <path d="M 100 125 A 25 25 0 0 1 75 100" stroke="#80DEEA" stroke-width="3" opacity="0.6"/>
          <path d="M 100 110 A 10 10 0 0 1 90 100" stroke="#B2EBF2" stroke-width="2" opacity="0.5"/>
        </g>
        <circle cx="100" cy="100" r="4" fill="#00BCD4" opacity="0.95"/>
      </svg>
    </div>

  </div>
</body>
</html>
