<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #121212; color: #ccc; font-family: monospace; margin: 40px 20px; }
  .zoom-row { display: flex; align-items: start; margin-bottom: 16px; }
  .row-label { width: 40px; font-size: 12px; color: #666; padding-top: 16px; flex-shrink: 0; }
  .scroll { display: flex; gap: 12px; }
  .card { flex-shrink: 0; text-align: center; }
  .frame { width: 60px; height: 60px; overflow: hidden; border-radius: 4px; background: #121212; cursor: pointer; }
  .frame img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(0.7) contrast(1.05); display: block; }
  .num { font-size: 10px; color: #555; margin-top: 3px; }
  h1 { font-size: 16px; margin-bottom: 16px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; padding: 8px 16px; border-radius: 4px; font-size: 13px; display: none; }
</style>
</head>
<body>
<h1>All logos — click to copy ID</h1>
<div id="grid"></div>
<div id="toast"></div>
<script>
const files = [
  { id: 1, src: '02bec1f3-f05f-4d0d-8ed7-e1c4609a9cf6.jpg' },
  { id: 2, src: '0cffb3e6-4a7c-43eb-84d7-e74a9b8b0d45.jpg' },
  { id: 3, src: '466c11c8-4d12-4db0-b304-658f5e3ef340.jpg' },
  { id: 4, src: '6143d95c-4e7a-4626-bec7-434f6f2e89ce.jpg' },
  { id: 5, src: 'a15c9084-4a30-4ea1-bbb3-4468751a92c4.jpg' },
  { id: 6, src: 'ca28f233-18a5-4050-8f5a-635a0d5ec162.jpg' },
  { id: 7, src: 'f766370a-1cdf-4122-8aa0-b1d269d6ebd8.jpg' },
  { id: 8, src: 'f766370a-1cdf-4122-8aa0-b1d269d6ebd8 (1).jpg' },
  { id: 9, src: 'Copilot_20260217_194707.png' },
  { id: 10, src: 'Copilot_20260217_194910.png' },
  { id: 11, src: 'Copilot_20260217_195108.png' },
  { id: 12, src: 'Copilot_20260217_195240.png' },
  { id: 13, src: 'Copilot_20260217_195340.png' },
  { id: 14, src: 'Copilot_20260217_195536.png' },
  { id: 15, src: 'Copilot_20260217_200510.png' },
  { id: 16, src: 'Copilot_20260217_200640.png' },
  { id: 17, src: 'Copilot_20260217_200904.png' },
  { id: 18, src: 'Copilot_20260217_201039.png' },
  { id: 19, src: 'Copilot_20260217_201443.png' },
  { id: 20, src: 'Gemini_Generated_Image_7sydog7sydog7syd.png' },
  { id: 21, src: 'Gemini_Generated_Image_cis8crcis8crcis8.png' },
  { id: 22, src: 'Gemini_Generated_Image_cis8crcis8crcis8 (1).png' },
  { id: 23, src: 'Gemini_Generated_Image_dt1ru1dt1ru1dt1r.png' },
  { id: 24, src: 'Gemini_Generated_Image_dump2idump2idump.png' },
  { id: 25, src: 'Gemini_Generated_Image_lf2yq2lf2yq2lf2y.png' },
  { id: 26, src: 'Gemini_Generated_Image_oyn05aoyn05aoyn0.png' },
  { id: 27, src: 'Gemini_Generated_Image_rcljxprcljxprclj.png' },
  { id: 28, src: 'Gemini_Generated_Image_s6h6kos6h6kos6h6.png' },
  { id: 29, src: 'Gemini_Generated_Image_y47xbby47xbby47x.png' },
];
const zooms = [1, 1.5, 2, 2.5, 3, 4];
const grid = document.getElementById('grid');

zooms.forEach(z => {
  const row = document.createElement('div');
  row.className = 'zoom-row';
  const label = document.createElement('div');
  label.className = 'row-label';
  label.textContent = z + 'x';
  row.appendChild(label);
  const scroll = document.createElement('div');
  scroll.className = 'scroll';
  files.forEach(f => {
    const card = document.createElement('div');
    card.className = 'card';
    const frame = document.createElement('div');
    frame.className = 'frame';
    const img = document.createElement('img');
    img.src = f.src;
    img.style.transform = `scale(${z})`;
    frame.appendChild(img);
    frame.onclick = () => {
      const text = `#${f.id} @ ${z}x`;
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('toast');
      toast.textContent = 'Copied: ' + text;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 1500);
    };
    card.appendChild(frame);
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = f.id;
    card.appendChild(num);
    scroll.appendChild(card);
  });
  row.appendChild(scroll);
  grid.appendChild(row);
});
</script>
</body>
</html>
