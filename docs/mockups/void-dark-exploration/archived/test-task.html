<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* === Raw Scale === */
    :root {
      --scale-black: oklch(0.12 0.01 260);
      --scale-dark: oklch(0.18 0.01 260);
      --scale-mid: oklch(0.45 0.01 260);
      --scale-light: oklch(0.75 0.01 260);
      --scale-pale: oklch(0.92 0.005 260);
      --scale-white: oklch(0.98 0.002 260);
      --scale-accent: oklch(0.72 0.18 145);
      --scale-accent-dim: oklch(0.52 0.12 145);

      --scale-font-display: 'DM Serif Display', serif;
      --scale-font-mono: 'IBM Plex Mono', monospace;

      --scale-space-xs: 0.5rem;
      --scale-space-sm: 1rem;
      --scale-space-md: 2rem;
      --scale-space-lg: 4rem;
      --scale-space-xl: 6rem;

      --scale-text-sm: 0.85rem;
      --scale-text-base: 1rem;
      --scale-text-lg: 1.25rem;
      --scale-text-xl: 2.5rem;
      --scale-text-hero: clamp(3rem, 8vw, 7rem);

      --scale-radius-sm: 4px;
      --scale-radius-md: 8px;
    }

    /* === Semantic Aliases === */
    :root {
      --surface-page: var(--scale-black);
      --surface-card: var(--scale-dark);
      --surface-elevated: oklch(0.22 0.01 260);

      --text-primary: var(--scale-white);
      --text-secondary: var(--scale-light);
      --text-muted: var(--scale-mid);
      --text-accent: var(--scale-accent);

      --border-subtle: oklch(0.25 0.01 260);
      --border-accent: var(--scale-accent-dim);

      --font-display: var(--scale-font-display);
      --font-body: var(--scale-font-mono);

      --gap-section: var(--scale-space-xl);
      --gap-element: var(--scale-space-md);
      --gap-inline: var(--scale-space-sm);
      --gap-tight: var(--scale-space-xs);

      --radius-container: var(--scale-radius-md);
      --radius-inline: var(--scale-radius-sm);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: var(--scale-text-base);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--gap-element);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, oklch(0.2 0.06 145 / 0.15), transparent),
        radial-gradient(ellipse 50% 50% at 80% 70%, oklch(0.18 0.04 260 / 0.2), transparent);
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: var(--gap-section);
    }

    .greeting {
      font-family: var(--font-display);
      font-size: var(--scale-text-hero);
      line-height: 1.05;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      animation: arrive 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .greeting span {
      display: block;
      color: var(--text-accent);
      animation: arrive 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .tagline {
      margin-top: var(--gap-inline);
      color: var(--text-muted);
      font-size: var(--scale-text-sm);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: arrive 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* === Task Instructions Panel === */
    .task-panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 72ch;
      margin-top: auto;
    }

    details {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-container);
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    details[open] {
      border-color: var(--border-accent);
    }

    summary {
      padding: var(--gap-inline) var(--gap-element);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: var(--scale-text-sm);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      list-style: none;
      display: flex;
      align-items: center;
      gap: var(--gap-tight);
      user-select: none;
      transition: color 0.2s ease;
    }

    summary:hover { color: var(--text-accent); }

    summary::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(-45deg);
      transition: transform 0.25s ease;
    }

    details[open] summary::before {
      transform: rotate(45deg);
    }

    summary::-webkit-details-marker { display: none; }

    .instructions-body {
      padding: 0 var(--gap-element) var(--gap-element);
      color: var(--text-secondary);
      font-size: var(--scale-text-sm);
      line-height: 1.75;
    }

    .instructions-body h3 {
      font-family: var(--font-display);
      color: var(--text-accent);
      font-size: var(--scale-text-lg);
      margin-top: var(--gap-element);
      margin-bottom: var(--gap-tight);
    }

    .instructions-body h3:first-child {
      margin-top: 0;
    }

    .instructions-body p {
      margin-bottom: var(--gap-inline);
    }

    .instructions-body p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="greeting">Hello, <span>World.</span></h1>
    <p class="tagline">A page exists. That is all.</p>
  </main>

  <div class="task-panel">
    <details>
      <summary>Task Instructions</summary>
      <div class="instructions-body" id="instructions"></div>
    </details>
  </div>

  <script>
    const sections = [
      {
        title: "The Core Task",
        text: "I was asked to create a hello world HTML page with a details/summary toggle at the bottom that summarizes the exact instructions I received. The output file was specified as docs/mockups/void-dark-exploration/test-task.html, placing it within an existing exploration directory for design mockups."
      },
      {
        title: "Agent Body and Prompt Rules",
        text: "The agent body established several firm constraints. Design tokens must be layered in two tiers: a raw scale of primitives, then semantic aliases that reference them, named by purpose rather than description. All colors must use oklch() notation, never hex or hsl. Repetitive content must be generated from JS data arrays rather than written as verbose repeated HTML. These three rules shaped every technical decision in the page."
      },
      {
        title: "The Frontend Design Skill",
        text: "A frontend-design skill was injected that acts as an aesthetic directive. It demands production-grade, visually striking interfaces that avoid generic patterns sometimes called AI slop. Before coding, I am to commit to a bold aesthetic direction considering purpose, tone, constraints, and a differentiating memorable quality. The skill lists specific focus areas: distinctive typography over generic families like Arial or Inter, cohesive color theming through CSS variables with dominant colors and sharp accents, purposeful motion and micro-interactions favoring CSS-only solutions, unexpected spatial composition with asymmetry and negative space, and atmospheric backgrounds using gradients, textures, and layered transparencies. It explicitly bans overused font families, cliched purple-on-white schemes, and cookie-cutter layouts."
      },
      {
        title: "Project and User Context",
        text: "The surrounding project is a personal blog built on Astro 5 with Tailwind CSS 4. The project instructions include a code change protocol requiring checks against a README for multi-location update patterns, blog writing tone guidelines, and rules about hero image aspect ratios. A global user config established workflow rules: questions are not permission to act, plans should be discussed before editing, code should never be reverted without asking, and all project information should live in project files. The git branch is astro-monochrome-v2, and the file lands in an untracked docs/mockups directory, so it sits outside the main build."
      },
      {
        title: "How I Interpreted It All",
        text: "I chose a dark, minimal aesthetic with DM Serif Display for the heading and IBM Plex Mono for body text, both distinctive without being overwrought. The oklch color system is built as a two-tier token layer: raw scale values for black, dark, mid, light, pale, white, and a green accent, then semantic aliases like surface-page, text-primary, and border-subtle that reference the scale. A subtle radial gradient wash adds atmosphere without distraction. The greeting animates in with a staggered cubic-bezier reveal. The instructions section you are reading now is generated entirely from a JS data array, honoring the rule against verbose repeated markup. The result is a self-documenting artifact: a working page that explains exactly how and why it was made."
      }
    ];

    const container = document.getElementById("instructions");
    const fragment = document.createDocumentFragment();

    sections.forEach(function(section) {
      const h3 = document.createElement("h3");
      h3.textContent = section.title;
      const p = document.createElement("p");
      p.textContent = section.text;
      fragment.appendChild(h3);
      fragment.appendChild(p);
    });

    container.appendChild(fragment);
  </script>
</body>
</html>
