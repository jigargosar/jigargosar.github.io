<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
<style>
  /* ===== Raw Scale ===== */
  :root {
    --scale-black: oklch(0% 0 0);
    --scale-gray-950: oklch(10% 0 0);
    --scale-gray-900: oklch(15% 0 0);
    --scale-gray-800: oklch(22% 0 0);
    --scale-gray-700: oklch(30% 0 0);
    --scale-gray-600: oklch(38% 0 0);
    --scale-gray-500: oklch(48% 0 0);
    --scale-gray-400: oklch(58% 0 0);
    --scale-gray-300: oklch(68% 0 0);
    --scale-gray-200: oklch(78% 0 0);
    --scale-gray-100: oklch(88% 0 0);
    --scale-white: oklch(98% 0 0);

    --scale-font-xs: 0.75rem;
    --scale-font-sm: 0.875rem;
    --scale-font-base: 1rem;
    --scale-font-lg: 1.25rem;
    --scale-font-xl: 1.5rem;
    --scale-font-2xl: 2rem;
    --scale-font-display: clamp(6rem, 18vw, 14rem);

    --scale-space-xs: 0.5rem;
    --scale-space-sm: 1rem;
    --scale-space-md: 1.5rem;
    --scale-space-lg: 3rem;
    --scale-space-xl: 6rem;

    /* ===== Semantic Aliases ===== */
    --surface-page: var(--scale-gray-950);
    --surface-subtle: var(--scale-gray-900);

    --text-primary: var(--scale-gray-300);
    --text-secondary: var(--scale-gray-600);
    --text-ghost: var(--scale-gray-800);
    --text-emphasis: var(--scale-gray-100);

    --border-rule: var(--scale-gray-800);

    --font-body: 'Newsreader', Georgia, serif;
    --font-mono: 'DM Mono', 'Courier New', monospace;

    --font-display: var(--scale-font-display);
    --font-label: var(--scale-font-xs);
    --font-caption: var(--scale-font-sm);
    --font-reading: var(--scale-font-base);

    --gap-section: var(--scale-space-xl);
    --gap-element: var(--scale-space-md);
    --gap-tight: var(--scale-space-xs);
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--surface-page);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
  }

  .container {
    text-align: center;
    position: relative;
    padding: var(--scale-space-sm);
  }

  .error-code {
    font-family: var(--font-mono);
    font-size: var(--font-display);
    font-weight: 300;
    color: var(--text-ghost);
    line-height: 0.85;
    letter-spacing: -0.04em;
    user-select: none;
    position: relative;
    animation: settle 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes settle {
    from {
      opacity: 0;
      letter-spacing: 0.2em;
    }
    to {
      opacity: 1;
      letter-spacing: -0.04em;
    }
  }

  .rule {
    width: 3rem;
    height: 1px;
    background: var(--border-rule);
    border: none;
    margin: var(--gap-element) auto;
    animation: rule-in 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rule-in {
    from {
      width: 0;
      opacity: 0;
    }
    to {
      width: 3rem;
      opacity: 1;
    }
  }

  .message {
    font-family: var(--font-body);
    font-size: var(--font-reading);
    font-weight: 300;
    font-style: italic;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
    animation: fade-up 0.8s 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes fade-up {
    from {
      opacity: 0;
      transform: translateY(0.75rem);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .back-link {
    display: inline-block;
    margin-top: var(--gap-element);
    font-family: var(--font-mono);
    font-size: var(--font-label);
    font-weight: 400;
    color: var(--text-secondary);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: var(--gap-tight) var(--scale-space-sm);
    border: 1px solid var(--border-rule);
    transition: color 0.3s, border-color 0.3s;
    animation: fade-up 0.8s 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .back-link:hover {
    color: var(--text-emphasis);
    border-color: var(--text-secondary);
  }
</style>
</head>
<body>

<main class="container">
  <div class="error-code">404</div>
  <hr class="rule">
  <p class="message">Nothing here but quiet.</p>
  <a href="/" class="back-link">Return</a>
</main>

</body>
</html>
