<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Dark v9 — Monochrome Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===================================================
     DESIGN TOKENS — RAW SCALE
     =================================================== */
  :root {
    /* --- Lightness scale (oklch L channel, monochrome) --- */
    --l-0: 0%;
    --l-3: 3%;
    --l-5: 5%;
    --l-8: 8%;
    --l-10: 10%;
    --l-12: 12%;
    --l-15: 15%;
    --l-18: 18%;
    --l-20: 20%;
    --l-25: 25%;
    --l-30: 30%;
    --l-35: 35%;
    --l-40: 40%;
    --l-45: 45%;
    --l-50: 50%;
    --l-55: 55%;
    --l-60: 60%;
    --l-65: 65%;
    --l-70: 70%;
    --l-75: 75%;
    --l-80: 80%;
    --l-85: 85%;
    --l-90: 90%;
    --l-95: 95%;
    --l-98: 98%;

    /* --- Type scale (major third — 1.25) --- */
    --step--2: 0.64rem;
    --step--1: 0.8rem;
    --step-0: 1rem;
    --step-1: 1.25rem;
    --step-2: 1.563rem;
    --step-3: 1.953rem;
    --step-4: 2.441rem;
    --step-5: 3.052rem;

    /* --- Spacing scale --- */
    --space-3xs: 0.25rem;
    --space-2xs: 0.5rem;
    --space-xs: 0.75rem;
    --space-s: 1rem;
    --space-m: 1.5rem;
    --space-l: 2rem;
    --space-xl: 3rem;
    --space-2xl: 4rem;
    --space-3xl: 6rem;
    --space-4xl: 8rem;

    /* --- Measure --- */
    --measure-narrow: 32ch;
    --measure-body: 62ch;
    --measure-wide: 80ch;

    /* ===================================================
       SEMANTIC TOKENS
       =================================================== */

    /* --- Surface --- */
    --surface-base: oklch(var(--l-5) 0 0);
    --surface-raised: oklch(var(--l-8) 0 0);
    --surface-overlay: oklch(var(--l-12) 0 0);
    --surface-inset: oklch(var(--l-3) 0 0);

    /* --- Text --- */
    --text-primary: oklch(var(--l-85) 0 0);
    --text-secondary: oklch(var(--l-55) 0 0);
    --text-tertiary: oklch(var(--l-40) 0 0);
    --text-heading: oklch(var(--l-90) 0 0);
    --text-inverse: oklch(var(--l-5) 0 0);

    /* --- Border --- */
    --border-subtle: oklch(var(--l-15) 0 0);
    --border-default: oklch(var(--l-20) 0 0);
    --border-strong: oklch(var(--l-30) 0 0);

    /* --- Interactive --- */
    --interactive-default: oklch(var(--l-60) 0 0);
    --interactive-hover: oklch(var(--l-80) 0 0);
    --interactive-focus: oklch(var(--l-90) 0 0);

    /* --- Accent (single warm tone for sparing use) --- */
    --accent-mark: oklch(var(--l-85) 0.04 80);

    /* --- Typography --- */
    --font-body: 'Newsreader', 'Georgia', serif;
    --font-ui: 'DM Sans', system-ui, sans-serif;
    --font-code: 'JetBrains Mono', 'Consolas', monospace;

    --leading-tight: 1.3;
    --leading-body: 1.72;
    --leading-relaxed: 1.85;

    --tracking-tight: -0.02em;
    --tracking-normal: 0;
    --tracking-wide: 0.04em;
    --tracking-caps: 0.1em;
  }

  /* ===================================================
     RESET
     =================================================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: 100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    scroll-behavior: smooth;
  }

  body {
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: var(--leading-body);
    color: var(--text-primary);
    background-color: var(--surface-base);
    min-height: 100dvh;
  }

  img { max-width: 100%; display: block; }
  a { color: inherit; }

  /* ===================================================
     LAYOUT
     =================================================== */
  .page-frame {
    max-width: var(--measure-wide);
    margin-inline: auto;
    padding-inline: var(--space-m);
  }

  /* ===================================================
     SITE HEADER
     =================================================== */
  .site-header {
    padding-block: var(--space-l);
    border-bottom: 1px solid var(--border-subtle);
  }

  .site-header__inner {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-m);
  }

  .site-title {
    font-family: var(--font-ui);
    font-size: var(--step-0);
    font-weight: 600;
    letter-spacing: var(--tracking-tight);
    color: var(--text-heading);
    text-decoration: none;
  }

  .site-nav {
    display: flex;
    gap: var(--space-m);
    font-family: var(--font-ui);
    font-size: var(--step--1);
  }

  .site-nav a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .site-nav a:hover { color: var(--text-primary); }

  /* ===================================================
     INDEX PAGE — POST LIST
     =================================================== */
  .index-hero {
    padding-block: var(--space-3xl) var(--space-2xl);
  }

  .index-hero__heading {
    font-family: var(--font-body);
    font-size: var(--step-3);
    font-weight: 400;
    line-height: var(--leading-tight);
    color: var(--text-heading);
    max-width: 20ch;
  }

  .index-hero__sub {
    margin-top: var(--space-s);
    font-family: var(--font-ui);
    font-size: var(--step--1);
    color: var(--text-secondary);
    max-width: var(--measure-narrow);
  }

  .post-list {
    list-style: none;
    border-top: 1px solid var(--border-subtle);
  }

  .post-item {
    border-bottom: 1px solid var(--border-subtle);
  }

  .post-item__link {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-xs) var(--space-l);
    align-items: baseline;
    padding-block: var(--space-l);
    text-decoration: none;
    transition: background-color 0.15s ease;
  }

  .post-item__link:hover {
    background-color: var(--surface-raised);
    margin-inline: calc(-1 * var(--space-s));
    padding-inline: var(--space-s);
    border-radius: 4px;
  }

  .post-item__title {
    font-family: var(--font-body);
    font-size: var(--step-1);
    font-weight: 500;
    line-height: var(--leading-tight);
    color: var(--text-heading);
    transition: color 0.15s ease;
  }

  .post-item__link:hover .post-item__title {
    color: var(--text-primary);
  }

  .post-item__date {
    font-family: var(--font-ui);
    font-size: var(--step--2);
    color: var(--text-tertiary);
    letter-spacing: var(--tracking-wide);
    white-space: nowrap;
  }

  .post-item__excerpt {
    grid-column: 1 / -1;
    font-size: var(--step--1);
    color: var(--text-secondary);
    max-width: var(--measure-body);
    line-height: var(--leading-body);
  }

  @media (max-width: 600px) {
    .post-item__link {
      grid-template-columns: 1fr;
    }
    .post-item__date {
      order: -1;
    }
  }

  /* ===================================================
     POST PAGE
     =================================================== */
  .post-header {
    padding-block: var(--space-3xl) var(--space-xl);
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: var(--space-2xl);
  }

  .post-meta {
    font-family: var(--font-ui);
    font-size: var(--step--2);
    color: var(--text-tertiary);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    margin-bottom: var(--space-m);
    display: flex;
    gap: var(--space-s);
    align-items: center;
  }

  .post-meta__sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-tertiary);
    flex-shrink: 0;
  }

  .post-title {
    font-family: var(--font-body);
    font-size: var(--step-4);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: var(--tracking-tight);
    color: var(--text-heading);
    max-width: 22ch;
    text-wrap: balance;
  }

  .post-subtitle {
    margin-top: var(--space-s);
    font-family: var(--font-body);
    font-size: var(--step-1);
    font-weight: 400;
    color: var(--text-secondary);
    font-style: italic;
    max-width: var(--measure-body);
  }

  /* ===================================================
     PROSE — ARTICLE BODY
     =================================================== */
  .prose {
    max-width: var(--measure-body);
    font-size: var(--step-0);
    line-height: var(--leading-body);
    color: var(--text-primary);
  }

  .prose > * + * {
    margin-top: var(--space-m);
  }

  /* --- Headings --- */
  .prose h2 {
    font-family: var(--font-body);
    font-size: var(--step-2);
    font-weight: 500;
    line-height: var(--leading-tight);
    color: var(--text-heading);
    letter-spacing: var(--tracking-tight);
    margin-top: var(--space-2xl);
    margin-bottom: var(--space-xs);
  }

  .prose h3 {
    font-family: var(--font-body);
    font-size: var(--step-1);
    font-weight: 600;
    line-height: var(--leading-tight);
    color: var(--text-heading);
    margin-top: var(--space-xl);
    margin-bottom: var(--space-2xs);
  }

  .prose h4 {
    font-family: var(--font-ui);
    font-size: var(--step-0);
    font-weight: 600;
    line-height: var(--leading-tight);
    color: var(--text-heading);
    letter-spacing: var(--tracking-wide);
    margin-top: var(--space-l);
    margin-bottom: var(--space-2xs);
  }

  /* --- Links --- */
  .prose a {
    color: var(--text-heading);
    text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    transition: text-decoration-color 0.15s ease;
  }

  .prose a:hover {
    text-decoration-color: var(--text-heading);
  }

  /* --- Strong, Em --- */
  .prose strong {
    font-weight: 600;
    color: var(--text-heading);
  }

  .prose em {
    font-style: italic;
  }

  /* --- Lists --- */
  .prose ul,
  .prose ol {
    padding-left: var(--space-m);
  }

  .prose li {
    margin-top: var(--space-2xs);
  }

  .prose li::marker {
    color: var(--text-tertiary);
  }

  /* --- Blockquote --- */
  .prose blockquote {
    border-left: 2px solid var(--border-default);
    padding-left: var(--space-m);
    margin-left: 0;
    color: var(--text-secondary);
    font-style: italic;
    line-height: var(--leading-relaxed);
  }

  .prose blockquote p + p {
    margin-top: var(--space-s);
  }

  /* --- Inline code --- */
  .prose code {
    font-family: var(--font-code);
    font-size: 0.875em;
    background: var(--surface-raised);
    padding: 0.15em 0.4em;
    border-radius: 3px;
    border: 1px solid var(--border-subtle);
    color: var(--accent-mark);
  }

  /* --- Code blocks --- */
  .prose pre {
    background: var(--surface-inset);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: var(--space-m);
    overflow-x: auto;
    font-family: var(--font-code);
    font-size: var(--step--1);
    line-height: 1.6;
    color: var(--text-primary);
    margin-block: var(--space-l);
  }

  .prose pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
    color: inherit;
  }

  /* --- Horizontal rule --- */
  .prose hr {
    border: none;
    border-top: 1px solid var(--border-subtle);
    margin-block: var(--space-2xl);
  }

  /* --- Images / Figures --- */
  .prose figure {
    margin-block: var(--space-xl);
  }

  .prose figure img {
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
  }

  .prose figcaption {
    margin-top: var(--space-xs);
    font-family: var(--font-ui);
    font-size: var(--step--2);
    color: var(--text-tertiary);
    text-align: center;
  }

  /* --- Table --- */
  .prose table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-ui);
    font-size: var(--step--1);
    margin-block: var(--space-l);
  }

  .prose thead {
    border-bottom: 2px solid var(--border-default);
  }

  .prose th {
    font-weight: 600;
    color: var(--text-heading);
    text-align: left;
    padding: var(--space-xs) var(--space-s);
    letter-spacing: var(--tracking-wide);
    font-size: var(--step--2);
    text-transform: uppercase;
  }

  .prose td {
    padding: var(--space-xs) var(--space-s);
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-primary);
  }

  .prose tbody tr:hover {
    background: var(--surface-raised);
  }

  /* --- Definition list --- */
  .prose dt {
    font-weight: 600;
    color: var(--text-heading);
    margin-top: var(--space-m);
  }

  .prose dd {
    margin-left: var(--space-m);
    color: var(--text-secondary);
  }

  /* --- Mark / Highlight --- */
  .prose mark {
    background: oklch(var(--l-20) 0.03 80);
    color: var(--accent-mark);
    padding: 0.1em 0.3em;
    border-radius: 2px;
  }

  /* --- Kbd --- */
  .prose kbd {
    font-family: var(--font-code);
    font-size: 0.85em;
    background: var(--surface-raised);
    border: 1px solid var(--border-default);
    border-bottom-width: 2px;
    padding: 0.1em 0.45em;
    border-radius: 4px;
    color: var(--text-heading);
  }

  /* --- Footnotes style --- */
  .prose .footnote-ref {
    font-family: var(--font-ui);
    font-size: var(--step--2);
    color: var(--text-secondary);
    text-decoration: none;
    vertical-align: super;
    line-height: 0;
    padding-inline: 0.15em;
  }

  .prose .footnotes {
    margin-top: var(--space-2xl);
    padding-top: var(--space-l);
    border-top: 1px solid var(--border-subtle);
    font-size: var(--step--1);
    color: var(--text-secondary);
  }

  /* ===================================================
     POST FOOTER
     =================================================== */
  .post-footer {
    margin-top: var(--space-3xl);
    padding-top: var(--space-l);
    border-top: 1px solid var(--border-subtle);
    font-family: var(--font-ui);
    font-size: var(--step--1);
    color: var(--text-tertiary);
    display: flex;
    justify-content: space-between;
    gap: var(--space-m);
  }

  .post-footer a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .post-footer a:hover { color: var(--text-primary); }

  /* ===================================================
     SITE FOOTER
     =================================================== */
  .site-footer {
    margin-top: var(--space-4xl);
    padding-block: var(--space-l);
    border-top: 1px solid var(--border-subtle);
    font-family: var(--font-ui);
    font-size: var(--step--2);
    color: var(--text-tertiary);
    text-align: center;
  }

  /* ===================================================
     PAGE VIEW TOGGLING
     =================================================== */
  .page-view { display: none; }
  .page-view.is-active { display: block; }

  .view-toggle {
    position: fixed;
    bottom: var(--space-l);
    right: var(--space-l);
    font-family: var(--font-ui);
    font-size: var(--step--2);
    background: var(--surface-overlay);
    color: var(--text-secondary);
    border: 1px solid var(--border-default);
    padding: var(--space-2xs) var(--space-s);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    z-index: 100;
    letter-spacing: var(--tracking-wide);
  }

  .view-toggle:hover {
    background: var(--surface-raised);
    color: var(--text-primary);
    border-color: var(--border-strong);
  }

  /* ===================================================
     SELECTION
     =================================================== */
  ::selection {
    background: oklch(var(--l-25) 0 0);
    color: var(--text-heading);
  }

  /* ===================================================
     SCROLLBAR
     =================================================== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--surface-base); }
  ::-webkit-scrollbar-thumb {
    background: var(--border-default);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>

<div class="page-frame">

  <!-- =============================================

  <footer class="site-footer" id="site-footer"></footer>

</div>

  const postContent = {
    title: 'The Hidden Cost of Premature Abstraction',
    subtitle: 'On the difference between flexible code and code that merely looks flexible',
    date: '2026-03-10',
    readTime: '8 min read',
    body: `
      <p>There is a moment, familiar to every programmer, where you look at two similar pieces of code and think: <em>I should extract this</em>. It feels responsible. It feels like craft. You create a function, add a parameter or two, and now both call sites share the same logic.</p>

      <p>This instinct is usually right. But "usually" is doing a lot of work in that sentence. The cost of a <strong>wrong</strong> abstraction is far higher than the cost of a little duplication, and we don't talk about that enough.</p>

      <h2>The Duplication Trap</h2>

      <p>The DRY principle (Don't Repeat Yourself) is perhaps the first design heuristic most programmers learn. It is also, in my experience, the one most often misapplied. Not because it's wrong, but because people pattern-match on <em>surface similarity</em> rather than <em>conceptual similarity</em>.</p>

      <p>Consider two functions in an e-commerce codebase. One calculates shipping cost. Another calculates tax. Both multiply a rate by a subtotal. The code looks identical. But shipping and taxation are governed by entirely different rules, change for entirely different reasons, and will diverge the moment business requirements shift.</p>

      <blockquote>
        <p>Duplication is far cheaper than the wrong abstraction.</p>
        <p>Sandi Metz said this years ago, and it remains one of the most important sentences in software engineering.</p>
      </blockquote>

      <p>When you merge these into a single <code>applyRate()</code> function, you have not reduced complexity. You have <em>hidden</em> it. The next developer who needs to add tax-exempt categories will find themselves modifying a function that is also responsible for shipping, adding conditionals, and praying nothing breaks.</p>

      <h2>How Wrong Abstractions Compound</h2>

      <p>The truly insidious thing about premature abstraction is that it gets <mark>harder to fix over time</mark>, not easier. Here is the typical lifecycle:</p>

      <ol>
        <li>Developer A sees duplication and extracts a shared function.</li>
        <li>Developer B needs slightly different behavior, adds a parameter.</li>
        <li>Developer C needs another variant, adds a second parameter and a conditional branch.</li>
        <li>Developer D is confused by the function but afraid to touch it, so they work around it.</li>
        <li>The function now has four parameters, three boolean flags, and a comment that says <code>// TODO: refactor</code>.</li>
      </ol>

      <p>Each step was locally reasonable. The cumulative result is a function that is harder to understand than the original duplication would have been. This is what I call <strong>abstraction debt</strong>: the ongoing cognitive tax of maintaining an abstraction that does not match the actual shape of the problem.</p>

      <h3>A Concrete Example</h3>

      <p>I once worked on a notification system that started with a clean, elegant <code>sendNotification()</code> function. It handled email. Then someone added SMS support. Then push notifications. Then in-app messages. Here is what it looked like after eighteen months:</p>

<pre><code>function sendNotification(user, message, opts = {}) {
  const channel = opts.channel || 'email';
  const priority = opts.priority || 'normal';
  const template = opts.template || 'default';
  const retryCount = opts.retry ?? 3;
  const batchId = opts.batchId || null;

  if (channel === 'email') {
    // 40 lines of email-specific logic
  } else if (channel === 'sms') {
    // 35 lines of SMS logic
    if (priority === 'urgent') {
      // special SMS gateway for urgent messages
    }
  } else if (channel === 'push') {
    // 50 lines of push notification logic
    // with platform-specific branches for iOS and Android
  } else if (channel === 'in-app') {
    // 25 lines of in-app logic
    if (batchId) {
      // batching logic that only applies to in-app
    }
  }
}</code></pre>

      <p>This function was 200 lines long. It had a cyclomatic complexity score that made our linter weep. And every time someone needed to modify email behavior, they had to mentally parse all four channels to make sure they were changing the right branch.</p>

      <h4>What Should Have Happened</h4>

      <p>Four separate functions. <code>sendEmail()</code>, <code>sendSMS()</code>, <code>sendPush()</code>, <code>sendInApp()</code>. Yes, there is some duplication in logging, retry logic, and error handling. That duplication could be handled with small, focused utilities. But the core delivery logic for each channel should have lived independently.</p>

      <h2>When Abstraction Is Right</h2>

      <p>I am not arguing against abstraction. Abstraction is the fundamental tool of software design. I am arguing for <em>patience</em>. Specifically, I follow a rule I learned from a colleague years ago:</p>

      <blockquote>
        <p>Wait for the third use case. The first two might be coincidence. The third tells you what the actual pattern is.</p>
      </blockquote>

      <p>There are a few signals that an abstraction is ready to be extracted:</p>

      <ul>
        <li>The duplicated code changes for the <strong>same reasons</strong>, not just at the same time.</li>
        <li>You can name the abstraction after <em>what it does</em>, not after <em>where it came from</em>.</li>
        <li>The abstraction makes the code easier to read, not just shorter.</li>
        <li>You can explain the abstraction's contract without referencing any specific call site.</li>
      </ul>

      <p>That last point is crucial. If your abstraction only makes sense when you know about its callers, it is not an abstraction. It is a code folding trick.</p>

      <h2>The Role of Experience</h2>

      <p>Junior developers tend to under-abstract. They copy-paste freely and end up with codebases where changes need to be made in seven places. Senior developers have the opposite problem: they over-abstract, building frameworks where scripts would suffice.</p>

      <p>The best code I have seen comes from people who have done both and learned the cost of each. They have felt the pain of a tangled inheritance hierarchy. They have also wasted days untangling a premature abstraction that a simpler approach would have avoided.</p>

      <table>
        <thead>
          <tr>
            <th>Signal</th>
            <th>Suggests</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Code looks the same</td>
            <td>Wait and watch</td>
          </tr>
          <tr>
            <td>Code changes for the same reason</td>
            <td>Consider abstracting</td>
          </tr>
          <tr>
            <td>You cannot name the abstraction clearly</td>
            <td>Not ready yet</td>
          </tr>
          <tr>
            <td>Three or more call sites with same pattern</td>
            <td>Likely worth extracting</td>
          </tr>
          <tr>
            <td>Abstraction needs boolean flags</td>
            <td>Probably the wrong shape</td>
          </tr>
        </tbody>
      </table>

      <h3>A Decision Framework</h3>

      <p>When I am deciding whether to abstract, I ask myself three questions:</p>

      <dl>
        <dt>What changes together?</dt>
        <dd>If the duplicated pieces change independently, they should stay separate. Coupling things that change independently is a recipe for accidental breakage.</dd>

        <dt>What is the cost of being wrong?</dt>
        <dd>If I extract this and it turns out to be the wrong abstraction, how hard will it be to inline it back? The harder the reversal, the more evidence I need before committing.</dd>

        <dt>Does this make the code easier to read right now?</dt>
        <dd>Not in some theoretical future. Right now, today, for the next person who opens this file. If the answer is no, I leave it alone.</dd>
      </dl>

      <h2>The Emotional Component</h2>

      <p>There is something I rarely see discussed in technical writing: the <em>emotional</em> appeal of abstraction. Extracting a shared function feels productive. It feels like you are improving the codebase. You get a small hit of satisfaction from making the code "cleaner."</p>

      <p>But cleanliness is not the same as clarity. A codebase with some duplication but where every function does one obvious thing is <em>clearer</em> than a codebase with zero duplication but where understanding any feature requires tracing through four layers of indirection.</p>

      <p>I have started asking myself a different question when I feel the urge to abstract: <em>Am I doing this for the code, or for myself?</em> If the answer is the latter, I close the file and move on.</p>

      <hr>

      <p>The next time you see two pieces of code that look similar, resist the reflex. Read them carefully. Ask whether they represent the same concept or just the same syntax. Ask whether they will change for the same reasons. Ask whether the abstraction has a name that means something on its own.</p>

      <p>If you cannot answer those questions confidently, leave the duplication alone. You can always extract later when you understand the pattern better. You cannot easily undo an abstraction that has spread through your codebase like roots through soil.</p>

      <p>Patience is the hardest skill in programming. It is also the most valuable.</p>
