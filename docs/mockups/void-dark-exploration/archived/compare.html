<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Dark Mockup Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- raw scale ---- */
    --scale-0: oklch(0% 0 0);
    --scale-2: oklch(12% 0 0);
    --scale-4: oklch(18% 0 0);
    --scale-6: oklch(24% 0 0);
    --scale-8: oklch(30% 0 0);
    --scale-20: oklch(45% 0 0);
    --scale-40: oklch(55% 0 0);
    --scale-60: oklch(65% 0 0);
    --scale-80: oklch(80% 0 0);
    --scale-95: oklch(92% 0 0);
    --scale-100: oklch(98% 0 0);

    --accent-warm: oklch(72% 0.12 55);
    --accent-cool: oklch(68% 0.08 250);
    --accent-gold: oklch(78% 0.14 80);
    --accent-mint: oklch(75% 0.1 165);

    --score-low: oklch(60% 0.08 25);
    --score-mid: oklch(65% 0.06 80);
    --score-high: oklch(75% 0.1 145);
    --score-top: oklch(82% 0.12 130);
    /* ---- semantic tokens ---- */
    --surface-base: var(--scale-0);
    --surface-raised: var(--scale-2);
    --surface-card: var(--scale-4);
    --surface-interactive: var(--scale-6);
    --surface-hover: var(--scale-8);

    --text-primary: var(--scale-100);
    --text-secondary: var(--scale-60);
    --text-tertiary: var(--scale-40);
    --text-muted: var(--scale-20);

    --border-subtle: var(--scale-6);
    --border-visible: var(--scale-8);

    --highlight-active: var(--accent-warm);
    --highlight-rank: var(--accent-gold);
    --highlight-info: var(--accent-cool);

    --font-display: 'Instrument Serif', Georgia, serif;
    --font-body: 'DM Mono', 'Courier New', monospace;

    --space-xs: 6px;
    --space-sm: 10px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 36px;
    --space-2xl: 56px;

    --radius-sm: 4px;
    --radius-md: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--surface-base);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 300;
    line-height: 1.5;
    min-height: 100vh;
    padding: var(--space-xl) var(--space-lg);
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
  }

  /* ---- header ---- */
  header {
    margin-bottom: var(--space-2xl);
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--border-subtle);
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: var(--space-xs);
  }

  header p {
    color: var(--text-tertiary);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ---- filter controls ---- */
  .controls {
    display: flex;
    gap: var(--space-lg);
    flex-wrap: wrap;
    margin-bottom: var(--space-xl);
    padding: var(--space-md) var(--space-lg);
    background: var(--surface-raised);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
  }

  .controls-label {
    color: var(--text-tertiary);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    margin-right: var(--space-sm);
    user-select: none;
  }

  .control-item {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .control-item input[type="checkbox"] {
    appearance: none;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--text-tertiary);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .control-item input[type="checkbox"]:checked {
    background: var(--highlight-active);
    border-color: var(--highlight-active);
  }

  .control-item input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 5px;
    width: 4px;
    height: 8px;
    border: solid var(--surface-base);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }

  .control-item label {
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    transition: color 0.15s;
    white-space: nowrap;
  }

  .control-item:hover label {
    color: var(--text-primary);
  }

  .control-item.is-unchecked label {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  /* ---- ranking list ---- */
  .ranking {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rank-row {
    display: grid;
    grid-template-columns: 40px 72px 1fr 80px;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    background: var(--surface-card);
    border-radius: var(--radius-sm);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.25s ease,
                background 0.2s ease;
  }

  .rank-row:hover {
    background: var(--surface-hover);
  }

  .rank-row.is-top {
    background: var(--surface-interactive);
    border-left: 3px solid var(--highlight-rank);
    padding-left: calc(var(--space-lg) - 3px);
  }

  .rank-position {
    font-family: var(--font-display);
    font-size: 22px;
    font-style: italic;
    color: var(--text-muted);
    text-align: center;
    min-width: 28px;
  }

  .is-top .rank-position {
    color: var(--highlight-rank);
  }

  .rank-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: 0.02em;
  }

  .rank-scores {
    display: flex;
    gap: var(--space-xs);
    flex-wrap: wrap;
  }

  .rank-score-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--surface-interactive);
    color: var(--text-secondary);
    white-space: nowrap;
    transition: opacity 0.2s, background 0.2s;
  }

  .rank-score-pill.is-active {
    background: oklch(25% 0.02 145);
    color: var(--score-high);
  }

  .rank-score-pill.is-inactive {
    opacity: 0.3;
  }

  .rank-composite {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 400;
    text-align: right;
    letter-spacing: -0.02em;
    transition: color 0.2s;
  }

  .rank-composite.score-tier-top { color: var(--score-top); }
  .rank-composite.score-tier-high { color: var(--score-high); }
  .rank-composite.score-tier-mid { color: var(--score-mid); }
  .rank-composite.score-tier-low { color: var(--score-low); }

  /* ---- empty state ---- */
  .empty-state {
    text-align: center;
    padding: var(--space-2xl) var(--space-lg);
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  /* ---- footer ---- */
  footer {
    margin-top: var(--space-2xl);
    padding-top: var(--space-lg);
    border-top: 1px solid var(--border-subtle);
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 0.03em;
  }

  /* ---- transition for reorder ---- */
  .ranking[data-animating="true"] .rank-row {
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s ease;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Void Dark Exploration</h1>
    <p>9 mockups -- median scores from 10 judges -- toggle criteria to re-rank</p>
  </header>

  <div class="controls" id="controls"></div>
  <div class="ranking" id="ranking"></div>

  <footer>
    Scores are medians on a 1-10 scale. Composite is the mean of selected criteria.
  </footer>
</div>

<script>
  const CRITERIA = [
    { key: 'readability', label: 'Long-form readability' },
    { key: 'hierarchy',   label: 'Visual hierarchy' },
    { key: 'void',        label: 'Void dark feel' },
    { key: 'elements',    label: 'Element distinction' }
  ];

  const MOCKUPS = [
    { id: 'v1', readability: 7,   hierarchy: 7,   void: 7, elements: 7   },
    { id: 'v2', readability: 6.5, hierarchy: 7,   void: 7, elements: 7   },
    { id: 'v3', readability: 7,   hierarchy: 8,   void: 8, elements: 7   },
    { id: 'v4', readability: 8,   hierarchy: 8,   void: 8, elements: 9   },
    { id: 'v5', readability: 8,   hierarchy: 7,   void: 9, elements: 8.5 },
    { id: 'v6', readability: 8,   hierarchy: 8,   void: 9, elements: 9   },
    { id: 'v7', readability: 7.5, hierarchy: 8,   void: 8, elements: 9   },
    { id: 'v8', readability: 8.5, hierarchy: 7.5, void: 8, elements: 9   },
    { id: 'v9', readability: 8,   hierarchy: 8,   void: 9, elements: 8.5 }
  ];

  const activeKeys = new Set(CRITERIA.map(c => c.key));

  function buildControls() {
    const container = document.getElementById('controls');
    const label = document.createElement('span');
    label.className = 'controls-label';
    label.textContent = 'Criteria';
    container.appendChild(label);

    CRITERIA.forEach(function(c) {
      const wrapper = document.createElement('div');
      wrapper.className = 'control-item';
      wrapper.dataset.key = c.key;

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.id = 'cb-' + c.key;
      input.checked = true;

      const lbl = document.createElement('label');
      lbl.htmlFor = 'cb-' + c.key;
      lbl.textContent = c.label;

      input.addEventListener('change', function() {
        if (this.checked) {
          activeKeys.add(c.key);
          wrapper.classList.remove('is-unchecked');
        } else {
          activeKeys.delete(c.key);
          wrapper.classList.add('is-unchecked');
        }
        renderRanking();
      });

      wrapper.appendChild(input);
      wrapper.appendChild(lbl);
      container.appendChild(wrapper);
    });
  }

  function computeComposite(mockup) {
    if (activeKeys.size === 0) return null;
    var sum = 0;
    activeKeys.forEach(function(key) {
      sum += mockup[key];
    });
    return sum / activeKeys.size;
  }

  function scoreTier(score) {
    if (score >= 8.5) return 'score-tier-top';
    if (score >= 8)   return 'score-tier-high';
    if (score >= 7)   return 'score-tier-mid';
    return 'score-tier-low';
  }

  function renderRanking() {
    var container = document.getElementById('ranking');
    container.innerHTML = '';

    if (activeKeys.size === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Select at least one criterion to see rankings.';
      container.appendChild(empty);
      return;
    }

    var ranked = MOCKUPS.map(function(m) {
      return { mockup: m, score: computeComposite(m) };
    });

    ranked.sort(function(a, b) {
      if (b.score !== a.score) return b.score - a.score;
      var idA = parseInt(a.mockup.id.slice(1));
      var idB = parseInt(b.mockup.id.slice(1));
      return idA - idB;
    });

    var topScore = ranked[0].score;

    ranked.forEach(function(entry, i) {
      var row = document.createElement('div');
      row.className = 'rank-row';
      if (entry.score === topScore) row.classList.add('is-top');

      var position = document.createElement('div');
      position.className = 'rank-position';
      position.textContent = i + 1;

      var name = document.createElement('div');
      name.className = 'rank-name';
      name.textContent = entry.mockup.id;

      var scores = document.createElement('div');
      scores.className = 'rank-scores';

      CRITERIA.forEach(function(c) {
        var pill = document.createElement('span');
        pill.className = 'rank-score-pill';
        if (activeKeys.has(c.key)) {
          pill.classList.add('is-active');
        } else {
          pill.classList.add('is-inactive');
        }
        pill.textContent = c.key.slice(0, 4) + ' ' + entry.mockup[c.key];
        pill.title = c.label + ': ' + entry.mockup[c.key];
        scores.appendChild(pill);
      });

      var composite = document.createElement('div');
      composite.className = 'rank-composite ' + scoreTier(entry.score);
      composite.textContent = entry.score.toFixed(1);

      row.appendChild(position);
      row.appendChild(name);
      row.appendChild(scores);
      row.appendChild(composite);
      container.appendChild(row);
    });
  }

  buildControls();
  renderRanking();
</script>
</body>
</html>
