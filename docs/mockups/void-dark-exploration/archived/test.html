<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void: #0a0a0a;
            --ash: #1a1a1a;
            --smoke: #2a2a2a;
            --ember: #c4c4c4;
            --ghost: #666;
            --flicker: #e8e8e8;
        }

        body {
            background: var(--void);
            color: var(--ember);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 50%, transparent 40%, var(--void) 100%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.008) 2px,
                    rgba(255, 255, 255, 0.008) 4px
                );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .greeting {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 400;
            letter-spacing: -0.03em;
            line-height: 0.9;
            color: var(--flicker);
            position: relative;
            animation: emerge 2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .greeting span {
            display: inline-block;
            animation: letterFloat 6s ease-in-out infinite;
        }

        .greeting span:nth-child(2) { animation-delay: 0.1s; }
        .greeting span:nth-child(3) { animation-delay: 0.2s; }
        .greeting span:nth-child(4) { animation-delay: 0.3s; }
        .greeting span:nth-child(5) { animation-delay: 0.4s; }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--ghost);
            margin-top: 2.5rem;
            animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        .line {
            width: 40px;
            height: 1px;
            background: var(--smoke);
            margin: 1.8rem auto 0;
            animation: expandLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1s both;
        }

        @keyframes emerge {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expandLine {
            from {
                opacity: 0;
                transform: scaleX(0);
            }
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes letterFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="greeting">
            <span>H</span><span>e</span><span>l</span><span>l</span><span>o</span>&ensp;World
        </h1>
        <p class="subtitle">from the void</p>
        <div class="line"></div>
    </div>
</body>
</html>
