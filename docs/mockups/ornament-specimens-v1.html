<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ornament Specimens</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: hsl(240 11% 3.5%);
  color: hsl(0 0% 100% / 0.58);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 60px 40px;
}
h1 {
  font-size: 14px;
  font-weight: 600;
  color: hsl(0 0% 100% / 0.3);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 16px;
}
.source-name {
  text-align: center;
  font-size: 10px;
  color: hsl(0 0% 100% / 0.15);
  margin-bottom: 60px;
}
.specimen {
  max-width: 820px;
  margin: 0 auto 56px;
  cursor: pointer;
  position: relative;
}
.specimen:hover .label { color: hsl(0 0% 100% / 0.4); }
.specimen:hover .divider-line { background: hsl(0 0% 100% / 0.12); }
.specimen:active { transform: scale(0.995); }
.label {
  font-size: 10px;
  color: hsl(0 0% 100% / 0.2);
  letter-spacing: 1px;
  margin-bottom: 12px;
  transition: color 150ms ease;
  user-select: none;
}
.divider {
  display: flex;
  align-items: center;
  gap: 0;
}
.divider-line {
  flex: 1;
  height: 1px;
  background: hsl(0 0% 100% / 0.07);
  transition: background 150ms ease;
}
.divider svg {
  flex-shrink: 0;
  margin: 0 12px;
  filter: invert(1) brightness(0.7) opacity(0.5);
}
.divider svg:hover {
  filter: invert(1) brightness(0.9) opacity(0.7);
}
.copied {
  position: absolute;
  top: 0; right: 0;
  font-size: 10px;
  color: hsl(0 0% 100% / 0.5);
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 300ms ease;
  user-select: none;
}
.copied.show { opacity: 1; }
.skip {
  font-size: 10px;
  color: hsl(0 0% 100% / 0.15);
  text-align: center;
  font-style: italic;
  margin-bottom: 40px;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>

<h1>Ornament Specimens</h1>
<div class="source-name" id="sourceName"></div>
<div id="specimens"></div>

<script>
const FILE = 'ornaments/10700738_43445.svg';
const MAX_WIDTH = 200;
const MAX_HEIGHT = 80;

document.getElementById('sourceName').textContent = FILE;

async function init() {
  const res = await fetch(FILE);
  const text = await res.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  const container = document.getElementById('specimens');

  // Get all top-level children (g and path)
  const topElements = Array.from(svg.children).filter(el =>
    el.tagName === 'g' || el.tagName === 'path'
  );

  // We need to measure bounding boxes — render hidden svg
  const measurer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  measurer.setAttribute('viewBox', svg.getAttribute('viewBox') || '0 0 450 550');
  measurer.style.cssText = 'position:absolute;left:-9999px;width:450px;height:550px;';
  document.body.appendChild(measurer);

  // Clone all elements into measurer for context
  Array.from(svg.children).forEach(child => {
    measurer.appendChild(child.cloneNode(true));
  });

  // Now measure each top-level element
  const measured = [];
  const measureChildren = Array.from(measurer.children).filter(el =>
    el.tagName === 'g' || el.tagName === 'path'
  );

  measureChildren.forEach((el, i) => {
    try {
      const bbox = el.getBBox();
      if (bbox.width > 0 && bbox.height > 0) {
        measured.push({
          index: i,
          bbox,
          element: topElements[i],
          html: topElements[i].outerHTML
        });
      }
    } catch(e) {}
  });

  document.body.removeChild(measurer);

  // Filter: skip very large ones (>300px in either dimension relative to viewBox)
  // and very tiny ones (<10px)
  const filtered = measured.filter(m => {
    const b = m.bbox;
    return b.width < 350 && b.height < 200 && b.width > 8 && b.height > 8;
  });

  // Sort by Y position
  filtered.sort((a, b) => a.bbox.y - b.bbox.y);

  // Take first 10
  const batch = filtered.slice(0, 10);

  if (batch.length === 0) {
    container.innerHTML = '<div class="skip">No suitable ornaments found in this file.</div>';
    return;
  }

  batch.forEach((item, idx) => {
    const b = item.bbox;
    const pad = 4;
    const vbX = (b.x - pad).toFixed(1);
    const vbY = (b.y - pad).toFixed(1);
    const vbW = (b.width + pad * 2).toFixed(1);
    const vbH = (b.height + pad * 2).toFixed(1);

    // Scale to fit max dimensions
    const aspect = b.width / b.height;
    let dispW, dispH;
    if (aspect > MAX_WIDTH / MAX_HEIGHT) {
      dispW = Math.min(b.width, MAX_WIDTH);
      dispH = dispW / aspect;
    } else {
      dispH = Math.min(b.height, MAX_HEIGHT);
      dispW = dispH * aspect;
    }

    const svgMarkup = `<svg width="${Math.round(dispW)}" height="${Math.round(dispH)}" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" fill="none" xmlns="http://www.w3.org/2000/svg">\n${item.html}\n</svg>`;

    const div = document.createElement('div');
    div.className = 'specimen';

    const copyText = svgMarkup.split('\n').map(l => '  ' + l).join('\n') + ',\n';

    div.innerHTML = `
      <div class="label">${String(idx + 1).padStart(2, '0')} · ${Math.round(b.width)}×${Math.round(b.height)}px</div>
      <div class="divider">
        <div class="divider-line"></div>
        <svg width="${Math.round(dispW)}" height="${Math.round(dispH)}" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" xmlns="http://www.w3.org/2000/svg">
          ${item.html}
        </svg>
        <div class="divider-line"></div>
      </div>
      <span class="copied">COPIED</span>
    `;

    div.addEventListener('click', () => {
      navigator.clipboard.writeText(copyText).then(() => {
        const badge = div.querySelector('.copied');
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 800);
      });
    });

    container.appendChild(div);
  });
}

init();
</script>

</body>
</html>
