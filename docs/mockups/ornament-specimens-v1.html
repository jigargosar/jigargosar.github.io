<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ornament Specimens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: hsl(240 11% 3.5%);
    color: hsl(0 0% 100% / 0.58);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 60px 40px;
  }
  h1 {
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: hsl(0 0% 100% / 0.3);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 60px;
  }
  .specimen {
    max-width: 820px;
    margin: 0 auto 64px;
    cursor: pointer;
    position: relative;
  }
  .specimen:hover .label { color: hsl(0 0% 100% / 0.4); }
  .specimen:hover .divider-line { background: hsl(0 0% 100% / 0.1); }
  .specimen:active { transform: scale(0.995); }
  .label {
    font-size: 10px;
    color: hsl(0 0% 100% / 0.2);
    letter-spacing: 1px;
    margin-bottom: 12px;
    transition: color 150ms ease;
    user-select: none;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: hsl(0 0% 100% / 0.07);
    transition: background 150ms ease;
  }
  .divider svg { flex-shrink: 0; margin: 0 8px; }
  .copied {
    position: absolute;
    top: 0; right: 0;
    font-size: 10px;
    color: hsl(0 0% 100% / 0.5);
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 300ms ease;
    user-select: none;
  }
  .copied.show { opacity: 1; }
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
</head>
<body>

<h1>Ornament Specimens</h1>

<div id="specimens"></div>

<script>
const W = hsl => `hsl(0 0% 100% / ${hsl})`;

// Metallic gradient defs — reused across ornaments
const DEFS = `
<defs>
  <linearGradient id="metal-h" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="hsl(0 0% 100%)" stop-opacity="0.08"/>
    <stop offset="35%" stop-color="hsl(0 0% 100%)" stop-opacity="0.28"/>
    <stop offset="50%" stop-color="hsl(0 0% 100%)" stop-opacity="0.38"/>
    <stop offset="65%" stop-color="hsl(0 0% 100%)" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="hsl(0 0% 100%)" stop-opacity="0.08"/>
  </linearGradient>
  <linearGradient id="metal-v" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="hsl(0 0% 100%)" stop-opacity="0.1"/>
    <stop offset="40%" stop-color="hsl(0 0% 100%)" stop-opacity="0.35"/>
    <stop offset="60%" stop-color="hsl(0 0% 100%)" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="hsl(0 0% 100%)" stop-opacity="0.1"/>
  </linearGradient>
  <linearGradient id="metal-d" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="hsl(0 0% 100%)" stop-opacity="0.06"/>
    <stop offset="50%" stop-color="hsl(0 0% 100%)" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="hsl(0 0% 100%)" stop-opacity="0.06"/>
  </linearGradient>
  <linearGradient id="metal-bright" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="hsl(0 0% 100%)" stop-opacity="0.12"/>
    <stop offset="50%" stop-color="hsl(0 0% 100%)" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="hsl(0 0% 100%)" stop-opacity="0.12"/>
  </linearGradient>
</defs>`;

const ornaments = [

  // 1 — Single diamond, clean
  { label: '01 · single diamond',
    w: 16, h: 16,
    paths: `<path d="M8 2 L14 8 L8 14 L2 8 Z" stroke="url(#metal-h)" stroke-width="0.8" fill="none"/>` },

  // 2 — Double nested diamond
  { label: '02 · nested diamond',
    w: 20, h: 16,
    paths: `<path d="M10 2 L17 8 L10 14 L3 8 Z" stroke="url(#metal-h)" stroke-width="0.8" fill="none"/>
            <path d="M10 5 L14 8 L10 11 L6 8 Z" stroke="url(#metal-h)" stroke-width="0.5" fill="none"/>` },

  // 3 — Diamond with horizontal spurs
  { label: '03 · diamond + spurs',
    w: 32, h: 14,
    paths: `<path d="M16 2 L22 7 L16 12 L10 7 Z" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M10 7 L4 7" stroke="url(#metal-h)" stroke-width="0.6"/>
            <path d="M22 7 L28 7" stroke="url(#metal-h)" stroke-width="0.6"/>
            <path d="M4 4.5 L0 7 L4 9.5" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M28 4.5 L32 7 L28 9.5" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>` },

  // 4 — Zigzag arms with center dot
  { label: '04 · zigzag arms',
    w: 48, h: 12,
    paths: `<circle cx="24" cy="6" r="1.5" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <circle cx="24" cy="6" r="0.5" fill="url(#metal-bright)"/>
            <path d="M22 6 L16 6 L13 3 L10 6 L4 6" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M26 6 L32 6 L35 3 L38 6 L44 6" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M4 3.5 L0 6 L4 8.5" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M44 3.5 L48 6 L44 8.5" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>` },

  // 5 — Crossed swords
  { label: '05 · crossed blades',
    w: 28, h: 16,
    paths: `<path d="M6 2 L22 14" stroke="url(#metal-d)" stroke-width="0.7"/>
            <path d="M22 2 L6 14" stroke="url(#metal-d)" stroke-width="0.7"/>
            <circle cx="14" cy="8" r="2" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M4 2 L6 2 M6 2 L6 4" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M24 2 L22 2 M22 2 L22 4" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M4 14 L6 14 M6 14 L6 12" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M24 14 L22 14 M22 14 L22 12" stroke="url(#metal-h)" stroke-width="0.5"/>` },

  // 6 — Three dots
  { label: '06 · three dots',
    w: 20, h: 8,
    paths: `<circle cx="4" cy="4" r="1" fill="url(#metal-bright)"/>
            <circle cx="10" cy="4" r="1.5" fill="url(#metal-bright)"/>
            <circle cx="16" cy="4" r="1" fill="url(#metal-bright)"/>` },

  // 7 — Arrow chain
  { label: '07 · arrow chain',
    w: 56, h: 12,
    paths: `<path d="M0 6 L6 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M6 3 L10 6 L6 9" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M10 6 L18 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M18 3 L22 6 L18 9" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M22 6 L34 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M34 9 L38 6 L34 3" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M38 6 L46 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M46 9 L50 6 L46 3" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M50 6 L56 6" stroke="url(#metal-h)" stroke-width="0.5"/>` },

  // 8 — Celtic-ish knot (simplified)
  { label: '08 · knot loop',
    w: 24, h: 16,
    paths: `<path d="M4 4 L12 4 L20 12 L12 12 Z" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M4 12 L12 12 L20 4 L12 4 Z" stroke="url(#metal-d)" stroke-width="0.7" fill="none"/>` },

  // 9 — Bracket pair
  { label: '09 · iron brackets',
    w: 36, h: 14,
    paths: `<path d="M6 2 L2 2 L2 12 L6 12" stroke="url(#metal-v)" stroke-width="0.8" fill="none"/>
            <path d="M30 2 L34 2 L34 12 L30 12" stroke="url(#metal-v)" stroke-width="0.8" fill="none"/>
            <path d="M15 7 L18 4 L21 7 L18 10 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>` },

  // 10 — Four-point star
  { label: '10 · four-point star',
    w: 20, h: 20,
    paths: `<path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <circle cx="10" cy="10" r="1.5" stroke="url(#metal-h)" stroke-width="0.5" fill="none"/>` },

  // 11 — Barbed line
  { label: '11 · barbed wire',
    w: 60, h: 10,
    paths: `<path d="M0 5 L60 5" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M10 5 L7 2 M10 5 L13 2" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M20 5 L17 8 M20 5 L23 8" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M30 5 L27 2 M30 5 L33 2" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M40 5 L37 8 M40 5 L43 8" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M50 5 L47 2 M50 5 L53 2" stroke="url(#metal-h)" stroke-width="0.5"/>` },

  // 12 — Cross with arms
  { label: '12 · iron cross',
    w: 30, h: 16,
    paths: `<path d="M13 0 L17 0 L17 6 L23 6 L23 10 L17 10 L17 16 L13 16 L13 10 L7 10 L7 6 L13 6 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M7 6 L2 3" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M7 10 L2 13" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M23 6 L28 3" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M23 10 L28 13" stroke="url(#metal-h)" stroke-width="0.5"/>` },

  // 13 — Two facing arrows
  { label: '13 · facing arrows',
    w: 40, h: 12,
    paths: `<path d="M0 6 L14 6" stroke="url(#metal-h)" stroke-width="0.6"/>
            <path d="M10 3 L16 6 L10 9" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M40 6 L26 6" stroke="url(#metal-h)" stroke-width="0.6"/>
            <path d="M30 3 L24 6 L30 9" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <circle cx="20" cy="6" r="1" fill="url(#metal-bright)"/>` },

  // 14 — Horizontal figure-8 / infinity
  { label: '14 · iron infinity',
    w: 32, h: 12,
    paths: `<path d="M8 2 Q0 6, 8 10 Q16 14, 24 10 Q32 6, 24 2 Q16 -2, 8 2 Z" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <circle cx="16" cy="6" r="1" fill="url(#metal-bright)"/>` },

  // 15 — Triple chevron
  { label: '15 · triple chevron',
    w: 52, h: 12,
    paths: `<path d="M4 2 L10 6 L4 10" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M12 2 L18 6 L12 10" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M24 6 L26 4 L28 6 L26 8 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M40 10 L34 6 L40 2" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M48 10 L42 6 L48 2" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>` },

  // 16 — Dagger
  { label: '16 · dagger',
    w: 10, h: 28,
    paths: `<path d="M5 0 L5 18" stroke="url(#metal-v)" stroke-width="0.8"/>
            <path d="M1 7 L9 7" stroke="url(#metal-h)" stroke-width="0.7"/>
            <path d="M3 18 L5 28 L7 18" stroke="url(#metal-v)" stroke-width="0.7" fill="none"/>
            <circle cx="5" cy="4" r="1.5" stroke="url(#metal-v)" stroke-width="0.5" fill="none"/>` },

  // 17 — Zigzag diamond chain
  { label: '17 · diamond chain',
    w: 56, h: 12,
    paths: `<path d="M4 6 L10 2 L16 6 L10 10 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M16 6 L22 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M22 6 L28 2 L34 6 L28 10 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M34 6 L40 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M40 6 L46 2 L52 6 L46 10 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M0 6 L4 6" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M52 6 L56 6" stroke="url(#metal-h)" stroke-width="0.5"/>` },

  // 18 — Rune-like H
  { label: '18 · rune mark',
    w: 16, h: 20,
    paths: `<path d="M4 0 L4 20" stroke="url(#metal-v)" stroke-width="0.7"/>
            <path d="M12 0 L12 20" stroke="url(#metal-v)" stroke-width="0.7"/>
            <path d="M4 7 L12 13" stroke="url(#metal-d)" stroke-width="0.6"/>
            <path d="M2 0 L6 0" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M10 0 L14 0" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M2 20 L6 20" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M10 20 L14 20" stroke="url(#metal-h)" stroke-width="0.5"/>` },

  // 19 — Stacked triangles
  { label: '19 · stacked points',
    w: 20, h: 18,
    paths: `<path d="M10 0 L18 10 L10 8 L2 10 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M10 18 L2 8 L10 10 L18 8 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>` },

  // 20 — Long ornate bar
  { label: '20 · ornate bar',
    w: 72, h: 14,
    paths: `<path d="M0 7 L8 7" stroke="url(#metal-h)" stroke-width="0.5"/>
            <path d="M8 4 L12 7 L8 10" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M12 7 L20 7 L24 3 L28 7 L32 3 L36 7" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M33 7 L36 4 L39 7 L36 10 Z" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M36 7 L40 7 L44 11 L48 7 L52 11 L56 7 L60 7" stroke="url(#metal-h)" stroke-width="0.7" fill="none"/>
            <path d="M60 10 L64 7 L60 4" stroke="url(#metal-h)" stroke-width="0.6" fill="none"/>
            <path d="M64 7 L72 7" stroke="url(#metal-h)" stroke-width="0.5"/>` },

];

const container = document.getElementById('specimens');

ornaments.forEach((o, i) => {
  const div = document.createElement('div');
  div.className = 'specimen';

  const svgCode = `<svg width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}" fill="none">\n${DEFS}\n${o.paths.split('\n').map(l => l.trim()).filter(Boolean).join('\n')}\n</svg>`;

  // Formatted copy text: indented, trailing comma
  const copyText = svgCode.split('\n').map(l => '      ' + l).join('\n') + '\n';

  div.innerHTML = `
    <div class="label">${o.label}</div>
    <div class="divider">
      <div class="divider-line"></div>
      <svg width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}" fill="none">
        ${DEFS}
        ${o.paths}
      </svg>
      <div class="divider-line"></div>
    </div>
    <span class="copied">COPIED</span>
  `;

  div.addEventListener('click', () => {
    navigator.clipboard.writeText(copyText).then(() => {
      const badge = div.querySelector('.copied');
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), 800);
    });
  });

  container.appendChild(div);
});
</script>

</body>
</html>
